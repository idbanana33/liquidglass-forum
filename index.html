<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiquidGlass Forum - 液态玻璃社区</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.0.3"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a0a0f;
      --bg-mid: #1a1a2e;
      --bg-light: #16213e;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-bg-hover: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-border-hover: rgba(255, 255, 255, 0.2);
      --glass-blur: blur(20px);
      --accent-cyan: #00d4ff;
      --accent-magenta: #ff006e;
      --accent-purple: #8b5cf6;
      --accent-green: #22c55e;
      --text-primary: rgba(255, 255, 255, 0.95);
      --text-secondary: rgba(255, 255, 255, 0.6);
      --text-tertiary: rgba(255, 255, 255, 0.4);
      --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.3);
      --shadow-glow-cyan: 0 0 30px rgba(0, 212, 255, 0.3);
      --shadow-glow-magenta: 0 0 30px rgba(255, 0, 110, 0.3);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --radius-pill: 100px;
      --radius-message: 20px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }

    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -3;
      background: linear-gradient(180deg, #0a0a12 0%, #0d0d1a 50%, #12101f 100%);
    }

    .bg-mesh {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background: 
        radial-gradient(ellipse at 30% 30%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 60%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(255, 0, 110, 0.05) 0%, transparent 40%),
        linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.3) 100%);
    }

    .caustics {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.4;
      pointer-events: none;
    }

    .caustics svg {
      width: 100%;
      height: 100%;
    }

    /* Navigation */
    .nav {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-glass);
      animation: slideDown 0.6s ease-out;
      height: 56px;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      text-decoration: none;
    }

    .nav-logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 18px;
      color: white;
    }

    .nav-logo-text {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 20px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-search {
      position: relative;
      flex: 1;
      max-width: 320px;
    }

    .nav-search input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-pill);
      padding: 10px 16px 10px 42px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .nav-search input::placeholder {
      color: var(--text-tertiary);
    }

    .nav-search input:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
    }

    .nav-search i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      font-size: 18px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      position: relative;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    .nav-btn .badge {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      background: var(--accent-magenta);
      border-radius: 50%;
    }

    .nav-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
      flex-shrink: 0;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .nav-avatar svg {
      width: 70%;
      height: 70%;
    }

    .nav-avatar:hover {
      border-color: var(--accent-cyan);
      box-shadow: var(--shadow-glow-cyan);
    }

    .nav-avatar-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    /* Settings Panel */
    .settings-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      z-index: 2000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .settings-panel.active {
      pointer-events: auto;
      opacity: 1;
    }

    .settings-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .settings-panel.active .settings-backdrop {
      opacity: 1;
    }

    .settings-content {
      position: absolute;
      top: 100px;
      right: 20px;
      width: 360px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-glass);
      transform: translateX(120%) translateY(-20px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .settings-panel.active .settings-content {
      transform: translateX(0) translateY(0);
      opacity: 1;
    }

    .settings-panel.closing .settings-content {
      transform: translateX(120%) translateY(-20px);
      opacity: 0;
    }

    .settings-header {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.1);
    }

    .settings-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .settings-avatar svg {
      width: 65%;
      height: 65%;
    }

    .settings-user-info {
      flex: 1;
    }

    .settings-name-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings-name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--text-primary);
    }

    .settings-edit-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .settings-edit-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: var(--text-primary);
    }

    .settings-status {
      font-size: 12px;
      color: var(--accent-green);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .settings-status::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      animation: livePulse 1.5s infinite;
    }

    .settings-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .settings-close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: var(--text-primary);
    }

    .settings-section {
      padding: 16px 20px;
      border-bottom: 1px solid var(--glass-border);
    }

    .settings-section:last-of-type {
      border-bottom: none;
    }

    .settings-section-title {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings-section-title i {
      color: var(--accent-cyan);
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .theme-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 12px 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .theme-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--glass-border-hover);
    }

    .theme-card.active {
      background: rgba(0, 212, 255, 0.1);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
    }

    .theme-preview {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .theme-card span {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
    }

    .theme-card.active span {
      color: var(--accent-cyan);
    }

    .name-edit-container {
      display: flex;
      gap: 8px;
    }

    .name-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .name-input:focus {
      border-color: var(--accent-cyan);
      background: rgba(255, 255, 255, 0.08);
    }

    .name-input::placeholder {
      color: var(--text-tertiary);
    }

    .name-save-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .name-save-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
    }

    .settings-actions {
      padding: 12px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .settings-action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .settings-action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--glass-border-hover);
      color: var(--text-primary);
    }

    .settings-action-btn i {
      color: var(--accent-cyan);
    }

    /* Main Layout */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 100px 24px 60px;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 32px;
    }

    /* Glass Card */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-glass);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    }

    .glass-card:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-hover);
      transform: translateY(-4px);
      box-shadow: var(--shadow-glass), 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    /* Public Chat Room */
    .public-chat {
      margin-bottom: 32px;
      animation: fadeInUp 0.6s ease-out;
    }

    .public-chat .glass-card {
      padding: 0;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.08), rgba(139, 92, 246, 0.08));
      overflow: hidden;
    }

    .public-chat-header {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.2);
    }

    .public-chat-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .public-chat-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .public-chat-info h3 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--text-primary);
    }

    .public-chat-info span {
      font-size: 12px;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .public-chat-info span::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--accent-cyan);
      border-radius: 50%;
      animation: livePulse 1.5s infinite;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.8); }
    }

    .public-chat-users {
      display: flex;
      align-items: center;
    }

    .chat-user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      border: 2px solid var(--bg-dark);
      margin-left: -8px;
      flex-shrink: 0;
      color: white;
    }

    .chat-user-avatar:first-child {
      margin-left: 0;
    }

    .chat-user-count {
      margin-left: 10px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .public-messages {
      height: 260px;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .public-message {
      display: flex;
      gap: 10px;
      animation: msgSlide 0.3s ease-out;
    }

    @keyframes msgSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .public-message .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
      color: white;
    }

    .public-message-content {
      flex: 1;
      min-width: 0;
    }

    .public-message-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .public-message-name {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-primary);
    }

    .public-message-time {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .public-message-text {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .public-message-text .highlight {
      color: var(--accent-cyan);
      font-weight: 500;
    }

    .public-input-area {
      padding: 12px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.15);
    }

    .public-input-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .public-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 10px 16px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .public-input:focus {
      border-color: var(--accent-cyan);
      background: rgba(255, 255, 255, 0.08);
    }

    .public-input::placeholder {
      color: var(--text-tertiary);
    }

    .public-send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .public-send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    }

    .public-send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* Categories */
    .categories {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      animation: fadeInUp 0.6s ease-out 0.1s both;
    }

    .category-pill {
      padding: 10px 20px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-pill:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-hover);
      color: var(--text-primary);
    }

    .category-pill.active {
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(139, 92, 246, 0.2));
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: var(--shadow-glow-cyan);
    }

    .category-pill i {
      font-size: 16px;
    }

    /* Posts */
    .posts {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .post {
      animation: fadeInUp 0.6s ease-out both;
    }

    .post:nth-child(1) { animation-delay: 0.1s; }
    .post:nth-child(2) { animation-delay: 0.2s; }
    .post:nth-child(3) { animation-delay: 0.3s; }
    .post:nth-child(4) { animation-delay: 0.4s; }

    .post-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .post-avatar {
      width: 48px;
      height: 48px;

  <script>
    // Cosmic Universe Starfield System
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let stars = [];
    let shootingStars = [];
    let nebulae = [];
    let dustClouds = [];
    let galaxyClusters = [];
    let time = 0;
    let animationId;

    const config = {
      starCount: 300,
      nebulaCount: 8,
      dustCount: 15,
      galaxyCount: 3,
      shootingStarInterval: 4000
    };

    // Star types with realistic characteristics
    const starTypes = [
      { weight: 60, color: { r: 255, g: 255, b: 255 }, name: 'white' },
      { weight: 15, color: { r: 200, g: 210, b: 255 }, name: 'blue-white' },
      { weight: 10, color: { r: 255, g: 240, b: 200 }, name: 'yellow' },
      { weight: 8, color: { r: 255, g: 200, b: 150 }, name: 'orange' },
      { weight: 5, color: { r: 255, g: 180, b: 180 }, name: 'red' },
      { weight: 2, color: { r: 180, g: 200, b: 255 }, name: 'blue' }
    ];

    function getRandomStarType() {
      const total = starTypes.reduce((sum, t) => sum + t.weight, 0);
      let random = Math.random() * total;
      for (const type of starTypes) {
        random -= type.weight;
        if (random <= 0) return type;
      }
      return starTypes[0];
    }

    class Star {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.z = Math.random() * 4;
        this.type = getRandomStarType();
        this.baseSize = Math.random() * 2.5 + 0.3;
        this.size = this.baseSize;
        this.twinkleSpeed = Math.random() * 0.0008 + 0.0002;
        this.twinkleOffset = Math.random() * Math.PI * 2;
        this.baseAlpha = Math.random() * 0.5 + 0.5;
        this.alpha = this.baseAlpha;
        this.twinkleAmount = Math.random() * 0.3 + 0.1;
        this.hasBurst = Math.random() > 0.6;
        this.burstPhase = Math.random() * Math.PI * 2;
        this.burstSpeed = Math.random() * 0.0008 + 0.0003;
        this.driftX = (Math.random() - 0.5) * 0.02;
        this.driftY = (Math.random() - 0.5) * 0.01;
      }

      update(dt) {
        this.x += this.driftX;
        this.y += this.driftY;

        if (this.x < -10) this.x = width + 10;
        if (this.x > width + 10) this.x = -10;
        if (this.y < -10) this.y = height + 10;
        if (this.y > height + 10) this.y = -10;

        if (this.hasBurst) {
          const burst = Math.sin(time * this.burstSpeed + this.burstPhase);
          const burstMod = Math.max(0, burst) * 0.8;
          const twinkle = Math.sin(time * this.twinkleSpeed + this.twinkleOffset);
          const extraTwinkle = Math.sin(time * this.twinkleSpeed * 2.3 + this.twinkleOffset * 1.7);
          this.alpha = this.baseAlpha * (1 - this.twinkleAmount + (twinkle + extraTwinkle * 0.3) * (this.twinkleAmount + burstMod));
          this.size = this.baseSize * (0.9 + twinkle * 0.1 + burstMod * 0.3);
        } else {
          const twinkle = Math.sin(time * this.twinkleSpeed + this.twinkleOffset);
          const extraTwinkle = Math.sin(time * this.twinkleSpeed * 2.3 + this.twinkleOffset * 1.7);
          this.alpha = this.baseAlpha * (1 - this.twinkleAmount + (twinkle + extraTwinkle * 0.3) * this.twinkleAmount);
          this.size = this.baseSize * (0.9 + twinkle * 0.1);
        }
      }

      draw() {
        const { r, g, b } = this.type.color;

        // Diffraction spike glow for larger stars
        if (this.size > 1.5 && this.z < 2) {
          this.drawDiffractionGlow(r, g, b);
        }

        // Core glow
        const gradient = ctx.createRadialGradient(
          this.x, this.y, 0,
          this.x, this.y, this.size * 5
        );
        gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${this.alpha})`);
        gradient.addColorStop(0.2, `rgba(${r}, ${g}, ${b}, ${this.alpha * 0.6})`);
        gradient.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${this.alpha * 0.2})`);
        gradient.addColorStop(1, 'transparent');

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 5, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();

        // Bright core
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * 0.9})`;
        ctx.fill();
      }

      drawDiffractionGlow(r, g, b) {
        ctx.save();
        ctx.globalAlpha = this.alpha * 0.3;

        // Horizontal spike
        const gradientH = ctx.createLinearGradient(
          this.x - this.size * 8, this.y,
          this.x + this.size * 8, this.y
        );
        gradientH.addColorStop(0, 'transparent');
        gradientH.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, 0.5)`);
        gradientH.addColorStop(1, 'transparent');

        ctx.fillStyle = gradientH;
        ctx.fillRect(this.x - this.size * 8, this.y - 0.5, this.size * 16, 1);

        // Vertical spike
        const gradientV = ctx.createLinearGradient(
          this.x, this.y - this.size * 8,
          this.x, this.y + this.size * 8
        );
        gradientV.addColorStop(0, 'transparent');
        gradientV.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, 0.5)`);
        gradientV.addColorStop(1, 'transparent');

        ctx.fillStyle = gradientV;
        ctx.fillRect(this.x - 0.5, this.y - this.size * 8, 1, this.size * 16);

        ctx.restore();
      }
    }

    class Nebula {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.baseRadius = Math.random() * 400 + 200;
        this.radius = this.baseRadius;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.0001;
        this.alpha = Math.random() * 0.15 + 0.05;
        this.layers = Math.floor(Math.random() * 3) + 2;
        this.hue = Math.random() * 360;
      }

      update() {
        this.rotation += this.rotationSpeed;
        this.x += 0.02;
        if (this.x > width + this.radius) {
          this.x = -this.radius;
        }
      }

      draw() {
        const cyan = getComputedStyle(document.documentElement).getPropertyValue('--accent-cyan').trim() || '#00d4ff';
        const purple = getComputedStyle(document.documentElement).getPropertyValue('--accent-purple').trim() || '#8b5cf6';

        const cyanRGB = hexToRgb(cyan);
        const purpleRGB = hexToRgb(purple);

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        for (let i = 0; i < this.layers; i++) {
          const layerRadius = this.radius * (1 - i * 0.2);
          const layerAlpha = this.alpha * (1 - i * 0.3);
          const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, layerRadius);

          if (i % 2 === 0) {
            gradient.addColorStop(0, `rgba(${cyanRGB.r}, ${cyanRGB.g}, ${cyanRGB.b}, ${layerAlpha})`);
            gradient.addColorStop(0.5, `rgba(${purpleRGB.r}, ${purpleRGB.g}, ${purpleRGB.b}, ${layerAlpha * 0.5})`);
          } else {
            gradient.addColorStop(0, `rgba(${purpleRGB.r}, ${purpleRGB.g}, ${purpleRGB.b}, ${layerAlpha})`);
            gradient.addColorStop(0.5, `rgba(${cyanRGB.r}, ${cyanRGB.g}, ${cyanRGB.b}, ${layerAlpha * 0.3})`);
          }
          gradient.addColorStop(1, 'transparent');

          ctx.beginPath();
          ctx.arc(0, 0, layerRadius, 0, Math.PI * 2);
          ctx.fillStyle = gradient;
          ctx.fill();
        }

        ctx.restore();
      }
    }

    class GalaxyCluster {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 150 + 80;
        this.rotation = Math.random() * Math.PI;
        this.rotationSpeed = (Math.random() - 0.5) * 0.0002;
        this.alpha = Math.random() * 0.1 + 0.03;
        this.armCount = Math.floor(Math.random() * 2) + 3;
        this.starCount = Math.floor(Math.random() * 100) + 50;
        this.hue = Math.random() * 60 + 200; // Blue-ish
      }

      update() {
        this.rotation += this.rotationSpeed;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.alpha;

        // Draw galaxy arms
        for (let arm = 0; arm < this.armCount; arm++) {
          const armAngle = (arm / this.armCount) * Math.PI * 2;
          ctx.rotate(armAngle);

          for (let i = 0; i < this.starCount; i++) {
            const distance = (i / this.starCount) * this.size;
            const spread = Math.sin(distance / this.size * Math.PI) * 30;
            const starX = Math.cos((i / this.starCount) * Math.PI * 4 + arm * 0.5) * spread;
            const starY = distance;
            const starSize = Math.random() * 1.5 + 0.5;
            const starAlpha = (1 - i / this.starCount) * 0.8;

            ctx.beginPath();
            ctx.arc(starX, starY, starSize, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${this.hue + i}, 30%, ${70 + Math.random() * 30}%, ${starAlpha})`;
            ctx.fill();
          }
        }

        // Core glow
        const coreGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * 0.3);
        coreGradient.addColorStop(0, `rgba(255, 255, 255, ${this.alpha * 2})`);
        coreGradient.addColorStop(0.5, `hsla(${this.hue}, 50%, 80%, ${this.alpha})`);
        coreGradient.addColorStop(1, 'transparent');

        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = coreGradient;
        ctx.fill();

        ctx.restore();
      }
    }

    class DustCloud {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.radius = Math.random() * 200 + 100;
        this.alpha = Math.random() * 0.03 + 0.01;
        this.drift = Math.random() * 0.1 + 0.02;
      }

      update() {
        this.x += this.drift;
        if (this.x > width + this.radius) {
          this.x = -this.radius;
        }
      }

      draw() {
        const gradient = ctx.createRadialGradient(
          this.x, this.y, 0,
          this.x, this.y, this.radius
        );
        gradient.addColorStop(0, `rgba(100, 100, 120, ${this.alpha})`);
        gradient.addColorStop(0.5, `rgba(80, 80, 100, ${this.alpha * 0.5})`);
        gradient.addColorStop(1, 'transparent');

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
      }
    }

    class ShootingStar {
      constructor() {
        this.reset();
      }

      reset() {
        const startSide = Math.floor(Math.random() * 4);
        switch (startSide) {
          case 0: // Top
            this.x = Math.random() * width;
            this.y = -50;
            this.angle = Math.PI * 0.3 + Math.random() * Math.PI * 0.4;
            break;
          case 1: // Left
            this.x = -50;
            this.y = Math.random() * height * 0.6;
            this.angle = Math.PI * -0.2 + Math.random() * Math.PI * 0.4;
            break;
          case 2: // Right
            this.x = width + 50;
            this.y = Math.random() * height * 0.6;
            this.angle = Math.PI * 0.8 + Math.random() * Math.PI * 0.4;
            break;
          case 3: // Bottom (rare)
            this.x = Math.random() * width;
            this.y = height + 50;
            this.angle = Math.PI * 1.3 + Math.random() * Math.PI * 0.4;
            break;
        }
        this.length = Math.random() * 250 + 150;
        this.speed = Math.random() * 12 + 6;
        this.alpha = 1;
        this.decay = Math.random() * 0.006 + 0.004;
        this.active = true;
        this.trail = [];
      }

      update() {
        if (!this.active) return;

        this.trail.push({ x: this.x, y: this.y, alpha: this.alpha });
        if (this.trail.length > 35) this.trail.shift();

        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.alpha -= this.decay;

        if (this.alpha <= 0 || this.x < -200 || this.x > width + 200 || this.y < -200 || this.y > height + 200) {
          this.active = false;
        }
      }

      draw() {
        if (!this.active) return;

        // Draw trail with fading
        for (let i = 0; i < this.trail.length; i++) {
          const t = this.trail[i];
          const trailAlpha = (i / this.trail.length) * t.alpha * 0.5;
          const trailSize = (i / this.trail.length) * 2;

          ctx.beginPath();
          ctx.arc(t.x, t.y, trailSize, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${trailAlpha})`;
          ctx.fill();
        }

        // Main trail
        const tailX = this.x - Math.cos(this.angle) * this.length;
        const tailY = this.y - Math.sin(this.angle) * this.length;

        const gradient = ctx.createLinearGradient(tailX, tailY, this.x, this.y);
        gradient.addColorStop(0, 'transparent');
        gradient.addColorStop(0.7, `rgba(200, 220, 255, ${this.alpha * 0.5})`);
        gradient.addColorStop(1, `rgba(255, 255, 255, ${this.alpha})`);

        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(this.x, this.y);
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Bright head
        const headGradient = ctx.createRadialGradient(
          this.x, this.y, 0,
          this.x, this.y, 12
        );
        headGradient.addColorStop(0, `rgba(255, 255, 255, ${this.alpha})`);
        headGradient.addColorStop(0.3, `rgba(200, 230, 255, ${this.alpha * 0.8})`);
        headGradient.addColorStop(1, 'transparent');

        ctx.beginPath();
        ctx.arc(this.x, this.y, 12, 0, Math.PI * 2);
        ctx.fillStyle = headGradient;
        ctx.fill();
      }
    }

    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return { r, g, b };
    }

    function animate(timestamp) {
      lastTime = timestamp;
      time = timestamp;

      ctx.clearRect(0, 0, width, height);

      for (const dust of dustClouds) {
        dust.update();
        dust.draw();
      }

      for (const nebula of nebulae) {
        nebula.update();
        nebula.draw();
      }

      for (const galaxy of galaxyClusters) {
        galaxy.update();
        galaxy.draw();
      }

      stars.sort((a, b) => a.z - b.z);
      for (const star of stars) {
        star.update();
        star.draw();
      }

      if (timestamp - lastShootingStar > nextShootingStarInterval) {
        spawnShootingStar();
        lastShootingStar = timestamp;
        nextShootingStarInterval = 1500 + Math.random() * 2500;
      }

      for (const shootingStar of shootingStars) {
        shootingStar.update();
        shootingStar.draw();
      }

      shootingStars = shootingStars.filter(s => s.active);

      animationId = requestAnimationFrame(animate);
    }

        .limit(50);
      
      publicMessages.innerHTML = '';
      if (!data || data.length === 0) {
        publicMessages.innerHTML = `
          <div class="empty-state">
            <i class="ph ph-chat-circle"></i>
            <p>暂无消息，快来发表第一条吧！</p>
          </div>
        `;
      } else {
        data.reverse().forEach(msg => addMessageToUI({
          user_name: msg.nickname,
          avatar: msg.avatar_seed,
          content: msg.message,
          created_at: msg.created_at
        }));
      }
    }
    
    function addMessageToUI(message) {
      const emptyState = publicMessages.querySelector('.empty-state');
      if (emptyState) {
        publicMessages.innerHTML = '';
      }
      
      const messageElement = document.createElement('div');
      messageElement.className = 'public-message';
      const avatarColor = message.avatar || getAvatarColor(message.user_name);
      const initial = message.user_name ? message.user_name[0].toUpperCase() : '?';
      const timeStr = message.created_at ? formatTime(message.created_at) : '刚刚';
      
      messageElement.innerHTML = `
        <div class="msg-avatar" style="background: ${avatarColor};">${initial}</div>
        <div class="public-message-content">
          <div class="public-message-header">
            <span class="public-message-name">${escapeHtml(message.user_name || '匿名用户')}</span>
            <span class="public-message-time">${timeStr}</span>
          </div>
          <div class="public-message-text">${escapeHtml(message.content)}</div>
        </div>
      `;
      publicMessages.appendChild(messageElement);
      publicMessages.scrollTop = publicMessages.scrollHeight;
    }
    
    function getAvatarColor(name) {
      const colors = [
        'linear-gradient(135deg, #667eea, #764ba2)',
        'linear-gradient(135deg, #f093fb, #f5576c)',
        'linear-gradient(135deg, #4facfe, #00f2fe)',
        'linear-gradient(135deg, #43e97b, #38f9d7)',
        'linear-gradient(135deg, #fa709a, #fee140)',
        'linear-gradient(135deg, #a18cd1, #fbc2eb)',
        'linear-gradient(135deg, #ff9a9e, #fecfef)',
        'linear-gradient(135deg, #00d4ff, #ff006e)'
      ];
      let hash = 0;
      for (let i = 0; i < (name || '').length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      return colors[Math.abs(hash) % colors.length];
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function formatTime(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const diff = now - date;
      
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
      
      return date.toLocaleDateString('zh-CN');
    }
    
    async function sendPublicMessage() {
      const messageText = publicInput.value.trim();
      if (!messageText) return;
      
      const avatar = getAvatarColor(settingsName.textContent);
      const now = new Date().toISOString();
      
      addMessageToUI({
        user_name: settingsName.textContent,
        avatar: avatar,
        content: messageText,
        created_at: now
      });
      
      if (!supabaseReady) {
        console.warn('Supabase not ready, message only saved locally');
        publicInput.value = '';
        publicSendBtn.disabled = true;
        return;
      }
      
      const { error } = await supabaseClient.from('chat_messages').insert({
        user_id: deviceUid,
        nickname: settingsName.textContent,
        avatar_seed: avatar,
        message: messageText
      });
      
      if (error) {
        console.error('Send failed:', error);
      }
      
      publicInput.value = '';
      publicSendBtn.disabled = true;
    }
    
    // Init Supabase after async load
    loadSupabaseScript(() => {
      // Realtime subscription
      supabaseClient
        .channel('public-chat')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, (payload) => {
          const msg = payload.new;
          if (msg.user_id === deviceUid) return;
          addMessageToUI({
            user_name: msg.nickname,
            avatar: msg.avatar_seed,
            content: msg.message,
            created_at: msg.created_at
          });
        })
        .subscribe();
      
      supabaseClient
        .channel('online-presence')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'online_users' }, () => {
          loadOnlineUsers();
        })
        .subscribe();
      
      // Initial load
      heartbeatOnline();
      loadOnlineUsers();
      loadMessages();
      
      setInterval(heartbeatOnline, 15000);
      setInterval(loadOnlineUsers, 10000);
      
      window.addEventListener('beforeunload', () => {
        if (supabaseReady) {
          supabaseClient.from('online_users').delete().eq('user_id', deviceUid);
        }
      });
    });
  </script>
</body>
</html>
